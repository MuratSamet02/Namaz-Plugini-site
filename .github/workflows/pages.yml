name: Siteyi yayınla

# Bu repo yalnızca tanıtım sitesini barındırır. Her push'ta GitHub Pages'e yayınlanır.
# Pages kaynağı: Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Pages'i hazırla
        uses: actions/configure-pages@v5

      - name: Siteyi paketle
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Yayınla
        id: deployment
        uses: actions/deploy-pages@v4
